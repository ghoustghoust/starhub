name: Update Star Hub

on:
  schedule:
    # Daily at 09:00 Asia/Shanghai (01:00 UTC).
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: starhub-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STARHUB_FAST: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          # Model keys are intentionally not wired here yet: free fallbacks only
          # until the user explicitly approves billing for this project.
        run: python fetch_and_build.py

      - name: Verify outputs
        run: |
          test -s index.html
          test -s ai-daily.html
          test -s assets/css/main.css
          test -s assets/js/app.js
          test -s assets/js/features/collection.js
          test -s assets/js/features/search.js
          test -s assets/css/ai-daily.css
          test -s assets/js/ai-daily.js
          ! grep -q 'rss-aggregator' index.html
          ! grep -q 'daily-insight' ai-daily.html

      - name: Validate data contracts
        run: PYTHONPATH=pipeline python -m starhub_pipeline validate

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html ai-daily.html _site/
          if [ -f trending_board.json ]; then cp trending_board.json _site/; fi
          if [ -d data ]; then cp -r data _site/; fi
          if [ -d assets ]; then cp -r assets _site/; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Persist data changes
        # Deploy first: a git push failure must not keep fresh data off the site.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data known_categories.json descriptions_zh.json trending_snapshot.json ai_daily.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: update starhub data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
