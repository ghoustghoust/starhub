name: Repo trim (one-off 历史瘦身)

# 为什么放在 GitHub Actions 里做，而不是本地：
# 实测本仓 `Checkout`（fetch-depth: 0）拉完整 5.23 GiB 历史只用 259 秒（≈20 MB/s），
# 而本机线路今天实测 0.21~0.34 MB/s 且 `git clone` 不能续传 —— 站内快约 100 倍。
#
# 四道硬闸，任一不过就不推：
#   ① 闸零：重写后消失的每一条提交，必须逐个证明它改过的东西全在被剔族里（本体在 tools/trim_commit_guard.py，
#      有单测、能跑红）。这条是 2026-09-30 dry-run 逼出来的：.git 5.3G->368M 很漂亮，
#      但提交数 2039->2037 悄悄少了 2 条，而原先"路径不许少"那道自测对提交数毫无约束。
#   ② dry_run 默认 true：只做测量与校验。
#   ③ confirm 必须原样等于 TRIM。
#   ④ compare-and-swap：远端 main 的 sha 必须仍等于本 job 检出时那个。
#      不等说明期间有整点构建提交过，强推会把那一场的提交覆盖掉 —— 直接中止，不猜。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = 只测量/校验，绝不推送（默认）'
        type: choice
        default: 'true'
        options: ['true', 'false']
      confirm:
        description: '真要推必须一字不差填 TRIM'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  # 与主构建同组、不取消：本 job 会排队等当期构建结束，避免与它抢 main。
  group: starhub-update
  cancel-in-progress: false

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 完整历史
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 记录基线（体积 / 各族解包 / 逐提交清单 / CAS 锚点）
        run: |
          set -eo pipefail
          git rev-parse origin/main > .base_sha
          echo "BASE_SHA=$(cat .base_sha)"
          du -sh .git | sed 's/^/重写前 .git = /'
          df -h . | tail -1 | sed 's/^/runner 磁盘: /'
          git rev-list --count HEAD | sed 's/^/提交数 = /'
          git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' \
            | awk '$1=="blob"{p=$3; if (p ~ /^rss-data-[1-9][0-9]*\.js$/) k="rss-data-[1-9]*";
                     else if (p ~ /^rss_history/) k="rss_history*";
                     else if (p ~ /^rss_api_snapshot/) k="rss_api_snapshot*";
                     else if (p == "rss_cache.json") k="rss_cache.json";
                     else next;
                     s[k]+=$2; n[k]++} END {for (q in s) printf "  待剔 %-16s %4d 版 %6.2f GB\n", q, n[q], s[q]/1073741824}'
          git ls-tree -r --name-only origin/main | sort > .paths_before
          # 两份逐提交清单必须在重写之前抓：重写后那些退化提交已经不存在，问不到它们改过什么。
          # --no-renames 是必须的：开重命名检测会把一次 delete+add 并成一条改名、只报目标名，
          # 于是"带走了源码"的提交能被读成"只改了数据文件"（闸零就此假绿放行）。
          git log --format='C|%H|%cI|%s' --no-renames --name-only > .commits_before.txt
          git log --format='P|%H|%p' > .commits_parents.txt
          wc -l < .commits_before.txt | sed 's/^/commits_before 行数 = /'
          wc -l < .commits_parents.txt | sed 's/^/commits_parents 行数 = /'

      - name: 安装 git-filter-repo
        run: |
          # 本 job 没有 setup-python，走 runner 系统 python；ubuntu-24.04 带 EXTERNALLY-MANAGED，
          # 裸 pip install 可能被 PEP 668 拒。按序兜底，最后必须让 --version 真跑出东西来。
          command -v git-filter-repo >/dev/null 2>&1 \
            || pip install --quiet git-filter-repo \
            || pip install --user --quiet --break-system-packages git-filter-repo
          export PATH="$HOME/.local/bin:$PATH"
          git filter-repo --version

      - name: 判据自测（trim_guard，destructive 步骤之前的最后一道纸面检查）
        # 这 21 条里有一条会把本 workflow 的 shell 步骤**真跑一遍**（合成仓 + 真 filter-repo），
        # 还有一条钉 `set -eo pipefail` 是承重墙。2026-09-30 第二趟就是栽在"读着没问题、跑着红"
        # 的开关上（--verbose 被 tail 吞掉退出码），所以这一步必须在动手之前绿。
        # 依赖自带：本 job 没有 setup-python（见上面 filter-repo 那步的注释），
        # 直接 pytest 会因 runner 系统 python 没有 pytest/pyyaml 而红 —— 那是这一步的缺陷，不是判据的。
        run: |
          python3 -m pip install --quiet pytest pyyaml \
            || python3 -m pip install --quiet --user --break-system-packages pytest pyyaml
          python3 -m pytest tests/trim_guard/ -q -s

      - name: 剔除死数据族（批 5b 起 rss-data-0.js 也不再保留：无测试读库内副本）
        run: |
          # 不要给 filter-repo 加 --verbose：本机与站内实测都不认这个开关，加了整步直接红
          # （2026-09-30 13:56Z 第二趟就是这么挂的，后面路径守恒/闸零/CAS 全没跑到）。
          set -eo pipefail
          git filter-repo --force --invert-paths \
            --path-glob 'rss-data-[1-9]*.js' \
            --path-glob 'rss_history.json' \
            --path-glob 'rss_history_*.json' \
            --path-glob 'rss_history_index.json' \
            --path-glob 'rss_api_snapshot*.json' \
            --path-glob 'rss_cache.json' | tail -40
        # filter-repo 会删掉 origin 远端并在结尾重排 refs，下面必须重新接上

      - name: 重写后自测（磁盘 / 路径守恒 / 剩余分块）
        run: |
          du -sh .git | sed 's/^/重写后 .git = /'
          git rev-list --count HEAD | sed 's/^/提交数（重写后）= /'
          git ls-tree -r --name-only HEAD | sort > .paths_after
          echo "剩余 rss-data 家族:"; git ls-tree -r --name-only HEAD | grep -E '^rss-data' || echo "  (无)"
          # 只允许"被剔的族"消失；其它任何路径少掉都算事故
          if comm -23 .paths_before .paths_after | grep -vE '^(rss-data-[1-9][0-9]*\.js|rss_history|rss_api_snapshot|rss_cache\.json$)' | grep .; then
            echo "::error::有不该消失的路径被剔掉了，见上，绝不推送"; exit 1
          fi
          if comm -13 .paths_before .paths_after | grep .; then
            echo "::error::重写后出现了原树没有的路径"; exit 1
          fi
          git remote add origin https://github.com/${{ github.repository }}.git

      - name: 决策与推送（四道闸）
        run: |
          set -e
          # 闸零：消失的每条提交都得自证是纯数据（或自身不改文件的空合并）。
          python3 tools/trim_commit_guard.py
          set -o pipefail
          BASE=$(cat .base_sha)
          echo "dry_run='${{ inputs.dry_run }}'  confirm='${{ inputs.confirm }}'  BASE_SHA=$BASE"
          if [ '${{ inputs.dry_run }}' != 'false' ]; then
            echo "dry-run：到此为止，绝不推送。看上面两栏体积差即为可回收量（GitHub 侧回收另有滞后）。"
            exit 0
          fi
          if [ '${{ inputs.confirm }}' != 'TRIM' ]; then
            echo "::error::confirm 不是 TRIM，拒绝强推"; exit 1
          fi
          LIVE=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$LIVE" != "$BASE" ]; then
            echo "::error::期间 main 已前进（$BASE -> $LIVE），有构建刚提交过；中止，请重跑一次 dry-run=false"; exit 1
          fi
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:refs/heads/main
          echo "已强推。下一步（人工）：本地换成新克隆、旧 .git mv 进隔离区；再核对 CI Checkout 秒数与新克隆体积"
