<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitHub Star 收藏台 · ghoustghoust</title>
<style>
:root{
  --bg:#f6f8fa; --card:#ffffff; --border:#d0d7de; --border2:#eaeef2;
  --text:#1f2328; --muted:#59636e; --faint:#6e7781;
  --brand:#0969da; --brand-strong:#0550ae; --brand-line:#54aeff; --brand-weak:#ddf4ff;
  --accent:var(--brand); --accent-line:var(--brand-line); --accent-weak:var(--brand-weak);
  --star:#e3a008; --star-bg:#fff8c5;
  --header-bg:rgba(255,255,255,.86);
  --hover:#f3f4f6; --hover-line:#afb8c1;
  --track:#d0d7de; --track-hover:#afb8c1;
  --mark:#fff3bf;
  --logo:#1f2328; --logo-sub:#59636e;
  --on-strong:#ffffff;
  --toast-bg:#1f2328; --toast-text:#ffffff;
  --faved-border:#e3b341; --faved-bg:linear-gradient(180deg,#fffdf2,#ffffff);
  --t-rising:#d4600a; --t-total:#0969da; --t-new:#1a7f37;
  --gold:#e3a008; --silver:#8b949e; --bronze:#c96f3b;
  --upd-color:#1a7f37; --upd-bg:#dafbe1;
  --radius:12px; --shadow:0 1px 2px rgba(31,35,40,.06),0 1px 0 rgba(31,35,40,.03);
  --shadow-card:0 1px 2px rgba(31,35,40,.06),0 1px 0 rgba(31,35,40,.03);
  --shadow-lift:0 6px 20px rgba(8,47,73,.14),0 1px 0 rgba(31,35,40,.05);
}
[data-theme="dark"]{
  --bg:#0d1117; --card:#161b22; --border:#30363d; --border2:#21262d;
  --text:#e6edf3; --muted:#9198a1; --faint:#8b949e;
  --brand:#4493f8; --brand-strong:#316dca; --brand-line:#1f6feb; --brand-weak:#0c2d6b;
  --accent:var(--brand); --accent-line:var(--brand-line); --accent-weak:var(--brand-weak);
  --star:#e3b341; --star-bg:#3b2f00;
  --header-bg:rgba(13,17,23,.86);
  --hover:#21262d; --hover-line:#3d444d;
  --track:#3d444d; --track-hover:#525860;
  --mark:#4a3a00;
  --logo:#e6edf3; --logo-sub:#9198a1;
  --on-strong:#1f2328;
  --toast-bg:#e6edf3; --toast-text:#0d1117;
  --faved-border:#9e6a03; --faved-bg:linear-gradient(180deg,#2a2308,#161b22);
  --t-rising:#f0883e; --t-total:#4493f8; --t-new:#3fb950;
  --gold:#e3b341; --silver:#9198a1; --bronze:#f0883e;
  --upd-color:#3fb950; --upd-bg:#12261e;
  --shadow:0 1px 2px rgba(1,4,9,.5),0 1px 0 rgba(1,4,9,.35);
  --shadow-card:0 1px 2px rgba(1,4,9,.5),0 1px 0 rgba(1,4,9,.35);
  --shadow-lift:0 6px 24px rgba(0,0,0,.45),0 1px 0 rgba(1,4,9,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.filled{fill:currentColor;stroke:none}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;background:var(--header-bg);
  backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid var(--border2);
}
.hd{max-width:1440px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{width:30px;height:30px;fill:var(--logo);flex:none}
.logo .t{display:flex;flex-direction:column;line-height:1.2}
.logo .t b{font-size:16px;font-weight:700;color:var(--logo)}
.logo .t span{font-size:12px;color:var(--logo-sub)}
.hd .sp{flex:1}
.hd .ov{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.hd .ov .badge{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;
  background:var(--accent-weak);border:1px solid var(--accent-line);color:var(--accent);font-weight:600;
  white-space:nowrap;
}
.hd .ov .badge .icon{width:12px;height:12px;color:var(--upd-color)}
.hd .ov .sep{width:1px;height:16px;background:var(--border)}
.hd .ov b{color:var(--text);font-weight:700}
.hd .acts{display:flex;gap:8px}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;
  border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);
  font-size:13px;font-weight:500;transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--hover);border-color:var(--hover-line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.loading .icon{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
.btn.primary:hover{background:var(--accent-line)}

/* ---------- trend-more ---------- */
.trend-more{
  width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;
  height:36px;border:1px dashed var(--border);border-radius:8px;background:transparent;
  color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;flex:none;
}
.trend-more:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-weak)}

/* ---------- stats ---------- */
.wrap{max-width:1440px;margin:0 auto;padding:18px 20px 40px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.side{display:flex;flex-direction:column;gap:20px;min-width:0;position:sticky;top:76px;height:calc(100vh - 96px);overflow:hidden}

/* ---------- side tabs ---------- */
.side-tabs{display:flex;gap:6px;flex:none}
.side-tab{
  flex:1;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--card);
  font-size:12px;color:var(--muted);transition:all .15s;
}
.side-tab.on{background:var(--text);border-color:var(--text);color:var(--on-strong)}
.trending:not(.on),.feed:not(.on){display:none}
.side .trending h2,.side .feed h2{display:none}
.main{
  width:100%;min-width:0;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);
}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.stat{
  background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);
  padding:14px 16px;display:flex;align-items:center;gap:12px;
}
.stat .ic{
  width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;
  border-radius:10px;background:var(--accent-weak);color:var(--accent);
}
.stat .ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat .ic.gold{background:var(--star-bg);color:var(--star)}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.stat .v small{font-size:13px;font-weight:500;color:var(--muted)}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.langbar{
  background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:14px;
}
.langbar .cap{
  display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:0;
  cursor:pointer;color:var(--text);text-align:left;
}
.langbar .cap b{font-size:13px;flex:none}
.langbar .cap span{font-size:12px;color:var(--muted);flex:1}
.langbar .cap .arrow{width:14px;height:14px;color:var(--faint);transition:transform .2s}
.langbar .cap[aria-expanded="false"] .arrow{transform:rotate(-90deg)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--border2);margin-top:10px}
.bar i{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.legend .li{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend .dot{width:9px;height:9px;border-radius:50%}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-bottom:12px}
.search{
  flex:1 1 280px;display:flex;align-items:center;gap:8px;height:40px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0 12px;
  box-shadow:var(--shadow);
}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.search .icon{color:var(--faint);width:20px;height:20px}
.search input{flex:1;border:0;outline:0;font-size:16px;background:transparent;color:var(--text)}
.search input::placeholder{color:var(--faint)}
.search .clear{color:var(--faint);font-size:18px;padding:0 2px;border:0;background:none;display:none}
.sel{position:relative}
.sel select{
  height:40px;min-width:120px;padding:0 34px 0 12px;font-size:14px;appearance:none;
  border:1px solid var(--border);border-radius:10px;background:var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239198a1' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>") no-repeat right 12px center;
  color:var(--text);cursor:pointer;box-shadow:var(--shadow);
}
.starsel{display:flex;height:40px;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.starsel button{
  height:100%;padding:0 12px;border:0;background:transparent;font-size:13px;color:var(--muted);
  border-right:1px solid var(--border2);white-space:nowrap;
}
.starsel button:last-child{border-right:0}
.starsel button.on{background:var(--accent);color:var(--on-strong)}

/* ---------- category tabs ---------- */
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 16px;margin-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--track) transparent;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%)}
.cats::-webkit-scrollbar{height:6px}
.cats::-webkit-scrollbar-track{background:transparent}
.cats::-webkit-scrollbar-thumb{background:var(--track);border-radius:3px}
.cats::-webkit-scrollbar-thumb:hover{background:var(--track-hover)}
.cat{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;flex:none;
  border:1px solid var(--border);border-radius:999px;background:var(--card);font-size:13px;color:var(--muted);
  transition:all .15s;
}
.cat .dot{width:8px;height:8px;border-radius:50%;background:var(--hover-line)}
.cat .n{font-size:11px;color:var(--faint)}
.cat:hover{border-color:var(--hover-line)}
.cat.on{background:var(--text);border-color:var(--text);color:var(--on-strong)}
.cat.on .n{color:var(--on-strong);opacity:.65}
.cat.on .dot{background:currentColor}

/* ---------- pinned ---------- */
.sec-title{display:flex;align-items:center;gap:8px;margin:16px 0 10px;font-size:14px;font-weight:700}
.sec-title .icon{color:var(--star)}
.pinned{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:6px}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{
  position:relative;display:flex;flex-direction:column;gap:8px;background:var(--card);
  border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-card);
  transition:border-color .15s,transform .15s,box-shadow .15s;
}
.card:hover{border-color:var(--accent-line);transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.card .top{display:flex;align-items:flex-start;gap:8px;padding-right:38px}
.card .id{flex:1;min-width:0}
.card .owner{font-size:11px;color:var(--faint);font-weight:500}
.card .name{font-size:15px;font-weight:650;color:var(--accent);word-break:break-all}
.card .name:hover{text-decoration:underline}
.card .desc{font-size:13px;color:var(--muted);line-height:1.55;min-height:40px}
.card .desc .desc-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card .desc.expand .desc-text{-webkit-line-clamp:unset}
.card .meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:auto;font-size:12px;color:var(--muted)}
.meta .lg{display:inline-flex;align-items:center;gap:5px}
.meta .lg .c{width:10px;height:10px;border-radius:50%}
.meta .st{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.meta .st .icon{width:14px;height:14px;color:var(--star)}
.meta .st .icon.filled{color:var(--star)}
.cat-tag{
  display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;
  font-size:11px;font-weight:500;white-space:nowrap;
}
.cat-tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.fav{
  position:absolute;top:10px;right:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:0;background:transparent;border-radius:8px;color:var(--faint);transition:all .15s;
}
.fav:hover{background:var(--hover);color:var(--star)}
.fav.on{color:var(--star)}
.fav .icon{width:20px;height:20px}
.card.faved{border-color:var(--faved-border);background:var(--faved-bg)}
.more{
  align-self:flex-start;border:0;background:none;color:var(--accent);font-size:12px;
  padding:0;margin-top:-2px;
}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- list view ---------- */
.view-list .grid,.view-list .pinned{display:flex;flex-direction:column;gap:6px}
.row{
  position:relative;display:flex;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--border);border-radius:10px;padding:9px 44px 9px 14px;box-shadow:var(--shadow);
  transition:border-color .15s;
}
.row:hover{border-color:var(--accent-line)}
.row.faved{border-color:var(--faved-border);background:var(--faved-bg)}
.row .nm{flex:none;min-width:0;max-width:32%;display:flex;flex-direction:column;line-height:1.25}
.row .nm .owner{font-size:10px;color:var(--faint)}
.row .nm .name{font-size:14px;font-weight:650;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm .name:hover{text-decoration:underline}
.row .dsc{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{flex:none;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.row .fav{top:50%;transform:translateY(-50%);right:8px}
.row .fav:hover{transform:translateY(-50%)}

/* ---------- empty ---------- */
.empty{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
.empty .icon{width:40px;height:40px;margin:0 auto 12px;color:var(--faint);display:block}
.empty b{display:block;font-size:15px;color:var(--text);margin-bottom:4px}

/* ---------- trending ---------- */
.trending{
  width:100%;flex:1;min-height:0;display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);
}
.trending h2,.main-title,.feed h2{display:flex;align-items:center;gap:8px;margin:0 0 2px;font-size:15px;font-weight:700}
.main-title{margin:0 0 14px}
.trending .trend-sub{font-size:11px;color:var(--faint);margin-bottom:12px}
.trend-tabs{display:flex;gap:6px;margin-bottom:12px}
.trend-tab{
  flex:1;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--card);
  font-size:12px;color:var(--muted);transition:all .15s;
}
.trend-tab.on{color:var(--on-strong)}
.trend-tab[data-tab="rising"].on{background:var(--t-rising);border-color:var(--t-rising)}
.trend-tab[data-tab="total"].on{background:var(--t-total);border-color:var(--t-total)}
.trend-tab[data-tab="new"].on{background:var(--t-new);border-color:var(--t-new)}
.trend-list{
  display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--track) transparent;
}
.trend-list::-webkit-scrollbar{width:6px}
.trend-list::-webkit-scrollbar-track{background:transparent}
.trend-list::-webkit-scrollbar-thumb{background:var(--track);border-radius:3px}
.trend-list::-webkit-scrollbar-thumb:hover{background:var(--track-hover)}
.trend-item{display:flex;align-items:center;gap:8px;padding:7px 4px;border:0;border-bottom:1px dashed var(--border2);border-radius:0;transition:background .15s}
.trend-item:hover{background:var(--hover)}
.trend-item .rank{flex:none;width:20px;height:20px;border-radius:5px;background:var(--hover);color:var(--muted);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.trend-item:nth-child(1) .rank{background:var(--gold);color:#fff}
.trend-item:nth-child(2) .rank{background:var(--silver);color:#fff}
.trend-item:nth-child(3) .rank{background:var(--bronze);color:#fff}
.trend-item .ti{flex:1;min-width:0}
.trend-item .tn{font-size:12.5px;font-weight:600;color:var(--accent);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trend-item .tn:hover{text-decoration:underline}
.trend-item .meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:1px;min-width:0}
.trend-item .td{font-size:11px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.trend-item .reason{font-size:11px;margin-top:4px;display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trending[data-tab="rising"] .reason{color:var(--t-rising)}
.trending[data-tab="total"] .reason{color:var(--t-total)}
.trending[data-tab="new"] .reason{color:var(--t-new)}
.trend-item .lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);flex:none}
.trend-item .lg .c{width:9px;height:9px;border-radius:50%;flex:none}
.trend-item .stars{color:var(--muted);display:inline-flex;align-items:center;gap:3px;flex:none}
.trend-item .tm{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px;min-width:0}
.trend-item .delta{color:var(--t-rising);font-weight:700;font-size:13px}
.trend-item .delta.neg{color:var(--muted)}

/* ---------- feed（今日关注动态） ---------- */
.feed{
  width:100%;flex:1;min-height:0;display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);
}
.feed .feed-sub{font-size:11px;color:var(--faint);margin-bottom:10px}
.feed-list{
  display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--track) transparent;
}
.feed-list::-webkit-scrollbar{width:6px}
.feed-list::-webkit-scrollbar-track{background:transparent}
.feed-list::-webkit-scrollbar-thumb{background:var(--track);border-radius:3px}
.feed-list::-webkit-scrollbar-thumb:hover{background:var(--track-hover)}
.feed-item{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--border2);font-size:12.5px;min-width:0}
.feed-item:last-child{border-bottom:0}
.feed-item .fd{flex:none;width:9px;height:9px;border-radius:50%}
.feed-item .fa{font-weight:600;color:var(--text);flex:none;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-item .fv{color:var(--muted);flex:none;white-space:nowrap}
.feed-item .ft{color:var(--accent);font-weight:500;flex:1;min-width:0;white-space:normal;word-break:break-all;line-height:1.35}
.feed-item .ft:hover{text-decoration:underline}
.feed-item .tm{margin-left:auto;color:var(--faint);font-size:11px;flex:none}

/* ---------- badge: 今日更新 ---------- */
.badge-update{
  display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:999px;
  font-size:11px;font-weight:600;color:var(--upd-color);background:var(--upd-bg);margin-left:6px;flex:none;
}

/* ---------- modal（完整榜浮层） ---------- */
.modal{
  position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  background:rgba(2,6,23,.55);opacity:0;pointer-events:none;transition:opacity .25s;padding:20px;
}
.modal.open{opacity:1;pointer-events:auto}
.modal .panel{
  width:100%;max-width:880px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lift);
  transform:translateY(16px) scale(.98);transition:transform .25s;
}
.modal.open .panel{transform:none}
.modal .m-hd{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border2)}
.modal .m-hd h3{font-size:15px;margin:0}
.modal .m-hd .close{
  margin-left:auto;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border:0;border-radius:8px;background:var(--hover);color:var(--muted);font-size:16px;cursor:pointer;transition:all .15s;
}
.modal .m-hd .close:hover{color:var(--text);background:var(--hover-line)}
.modal .m-tabs{display:flex;gap:8px;padding:14px 20px 0}
.modal .m-list{overflow-y:auto;padding:10px 20px 20px;min-height:0}
.modal .m-list .trend-item{
  display:flex;align-items:flex-start;gap:10px;padding:10px 8px;

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--toast-bg);color:var(--toast-text);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;
  pointer-events:none;transition:all .25s;z-index:100;max-width:90vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1100px){

// ---- 模糊搜索 ----
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function hl(s){
  const t = escHtml(s);
  if(!state.q) return t;
  const tokens = state.q.split(/\s+/).filter(Boolean)
    .map(x => escHtml(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!tokens.length) return t;
  tokens.sort((a,b)=>b.length-a.length);
  try{
    return t.replace(new RegExp('('+tokens.join('|')+')','gi'), '<mark>$1</mark>');
  }catch(e){ return t; }
}

function fuzzyMatch(d, q){
  const hay = (d.name+' '+d.owner+' '+d.full_name+' '+(d.desc||'')+' '+(d.language||'')+' '+(d.categoryLabel||'')+' '+(d.topics||[]).join(' ')).toLowerCase();
  const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  return tokens.every(t => hay.includes(t));
}

function filterData(){
  let list = DATA.filter(d => {
    if(state.q && !fuzzyMatch(d, state.q)) return false;
    if(state.cat && d.category !== state.cat) return false;
    if(state.lang && d.language !== state.lang) return false;
    if(state.star === 'lt1k' && d.stars >= 1000) return false;
    if(state.star === '1k10k' && (d.stars < 1000 || d.stars >= 10000)) return false;
    if(state.star === '10k100k' && (d.stars < 10000 || d.stars >= 100000)) return false;
    if(state.star === 'gt100k' && d.stars < 100000) return false;
    return true;
  });
  const cmp = {
    'stars-desc': (a,b)=>b.stars-a.stars,
    'stars-asc': (a,b)=>a.stars-b.stars,
    'recent': (a,b)=>(b.pushed_at||'').localeCompare(a.pushed_at||''),
    'name': (a,b)=>a.name.localeCompare(b.name),
  }[state.sort];
  list.sort(cmp);
  const faved = list.filter(d=>favs.has(d.full_name));
  const rest = list.filter(d=>!favs.has(d.full_name));
  return { faved, rest };
}

function catColor(key){
  const c = CATS.find(x=>x.key===key);
  if(!c) return '#8b949e';
  return document.documentElement.dataset.theme === 'dark' ? (c.dark || c.color) : c.color;
}

function buildCard(d, isFav){
  const div = document.createElement('article');
  div.className = 'card' + (isFav?' faved':'');
  const catColorVal = catColor(d.category);
  const desc = d.desc || '暂无简介';
  const descHtml = desc.length > 60
    ? '<span class="desc-text">'+hl(desc)+'</span><button class="more" data-act="expand">展开</button>'
    : '<span class="desc-text">'+hl(desc)+'</span>';
  div.innerHTML =
    '<button class="fav'+(isFav?' on':'')+'" data-act="fav" title="收藏/取消收藏">'+(isFav?icon.starFilled:icon.star)+'</button>' +
    '<div class="top"><div class="id">' +
      '<div class="owner">'+escHtml(d.owner)+'</div>' +
      '<a class="name" href="'+d.html_url+'" target="_blank" rel="noopener">'+hl(d.name)+'</a>' +
      (d.updated_today ? '<span class="badge-update">今日更新</span>' : '') +
    '</div>' +
    '<a class="cat-tag" style="color:'+catColorVal+';background:'+catColorVal+'1f" href="javascript:void 0" data-act="cattag" data-cat="'+d.category+'">' +
      '<span class="dot"></span>'+d.categoryLabel+'</a>' +
    '</div>' +
    '<div class="desc" data-act="desc">'+descHtml+'</div>' +
    '<div class="meta">' +
      (d.language ? '<span class="lg"><span class="c" style="background:'+(LANG_COLORS[d.language]||'#8b949e')+'"></span>'+d.language+'</span>' : '') +
      '<span class="st">'+icon.starFilled+''+fmtStars(d.stars)+'</span>' +
      '<a class="st" style="color:var(--accent);font-weight:600" href="'+d.html_url+'" target="_blank" rel="noopener">'+icon.link+'打开</a>' +
    '</div>';
  return div;
}

function buildRow(d, isFav){
  const div = document.createElement('div');
  div.className = 'row' + (isFav?' faved':'');
  const catColorVal = catColor(d.category);
  const desc = d.desc || '暂无简介';
  div.innerHTML =
    '<button class="fav'+(isFav?' on':'')+'" data-act="fav" title="收藏/取消收藏">'+(isFav?icon.starFilled:icon.star)+'</button>' +
    '<div class="nm"><span class="owner">'+escHtml(d.owner)+'</span>' +
      '<a class="name" href="'+d.html_url+'" target="_blank" rel="noopener">'+hl(d.name)+'</a></div>' +
    '<span class="dsc" title="'+escHtml(desc)+'">'+hl(desc)+'</span>' +
    '<div class="meta">' +
      (d.updated_today ? '<span class="badge-update">今日更新</span>' : '') +
      (d.language ? '<span class="lg"><span class="c" style="background:'+(LANG_COLORS[d.language]||'#8b949e')+'"></span>'+d.language+'</span>' : '') +
      '<span class="st">'+icon.starFilled+''+fmtStars(d.stars)+'</span>' +
      '<span class="cat-tag" style="color:'+catColorVal+';background:'+catColorVal+'1f"><span class="dot"></span>'+d.categoryLabel+'</span>' +
      '<a class="st" style="color:var(--accent);font-weight:600" href="'+d.html_url+'" target="_blank" rel="noopener">'+icon.link+'打开</a>' +
    '</div>';
  return div;
}

function fmtStars(n){
  if(n>=100000) return (n/1000).toFixed(0)+'k';
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'k';
  return n;
}

function renderList(){
  const { faved, rest } = filterData();
  const pinnedWrap = $('#pinnedWrap'), pinned = $('#pinned'), grid = $('#grid'), empty = $('#empty');
  const isList = getView() === 'list';
  const build = isList ? buildRow : buildCard;

  // 置顶区
  if(faved.length){
    pinnedWrap.style.display='';
    pinned.innerHTML='';
    faved.forEach(d => pinned.appendChild(build(d, true)));
    $('#pinnedCount').textContent = '('+faved.length+')';
  } else {
    pinnedWrap.style.display='none';
  }

  // 主列表
  grid.innerHTML='';
  rest.forEach(d => grid.appendChild(build(d, false)));
  $('#listCount').textContent = '('+rest.length+')';
  $('#listTitle').textContent = state.cat
    ? (CATS.find(c=>c.key===state.cat)||{}).label || '全部项目'
    : '全部项目';

  const hasFilter = state.cat || state.lang || state.star !== 'all';
  empty.style.display = (faved.length + rest.length === 0) ? 'block' : 'none';
  if(faved.length + rest.length === 0){
    $('#emptyHint').textContent = hasFilter ? '当前有分类 / 语言 / 星标筛选在生效，可能挡住了结果' : '试试换一个关键词';
    $('#btnResetAll').style.display = hasFilter ? 'inline-flex' : 'none';
  }

  // 统计
  $('#stTotal').textContent = counted ? DATA.length : '0';
  $('#stCats').textContent = CATS.length;
  $('#stLangs').textContent = langSorted.length;
  $('#stFav').textContent = favs.size;
}

// ---- 每日 AI 排行榜 ----
function buildTrendItem(p, i, full){
  const hasDelta = p.delta !== null && p.delta !== undefined;
  const deltaHtml = state.trendTab === 'rising'
    ? (hasDelta
        ? '<span class="delta' + (p.delta < 0 ? ' neg':'') + '">' + (p.delta > 0 ? '+':'') + p.delta + '</span>'
        : '<span class="delta" style="color:var(--faint)">新</span>')
    : '';
  const rank = '<span class="rank">' + (i+1) + '</span>';
  const name = '<a class="tn" href="' + escHtml(p.html_url) + '" title="' + escHtml(p.owner) + '/' + escHtml(p.name) + '" target="_blank" rel="noopener">' + escHtml(p.owner) + '/' + escHtml(p.name) + '</a>';
  const lang = p.language
    ? '<span class="lg"><span class="c" style="background:' + (LANG_COLORS[p.language] || '#8b949e') + '"></span>' + escHtml(p.language) + '</span>'
    : '';
  const stars = '<span class="stars">★ ' + fmtStars(p.stars) + '</span>';
  const reason = '<span class="reason">' + escHtml(p.reason || '') + '</span>';
  if(full){
    return rank + '<div class="ti">' + name +
      '<span class="td" title="' + escHtml(p.desc || '暂无简介') + '">' + escHtml(p.desc || '暂无简介') + '</span>' + reason +
      '</div>' + '<div class="tm">' + deltaHtml + stars + '</div>';
  }
  return rank + '<div class="ti">' + name +
    '<span class="td" title="' + escHtml(p.desc || '暂无简介') + '">' + escHtml(p.desc || '暂无简介') + '</span>' +
    '<span class="meta">' + lang + stars + '</span>' +
    '</div>' + '<div class="tm">' + deltaHtml + reason + '</div>';
}

function renderTrending(){
  const list = $('#trendList');
  const items = (TRENDING && TRENDING[state.trendTab]) || [];
  const box = $('.trending'); if(box) box.setAttribute('data-tab', state.trendTab);
  $('#trendUpdated').textContent = '更新于 ' + UPDATED;
  list.innerHTML = '';
  if(!items.length){
    const msg = state.trendTab === 'rising'
      ? '首次运行正在建立基线，明天起显示每日涨星变化'
      : '暂无数据';
    list.innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:24px 0">'+msg+'</div>';
    return;
  }
  items.slice(0, 10).forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'trend-item';
    row.innerHTML = buildTrendItem(p, i, false);
    list.appendChild(row);
  });
}

function switchTrendTab(tab, scope){
  state.trendTab = tab;
  document.querySelectorAll((scope || '#trendTabs') + ' .trend-tab').forEach(x=>x.classList.toggle('on', x.dataset.tab===tab));
  renderTrending();
}

function switchSideTab(tab){
  state.sideTab = tab;
  document.querySelectorAll('.side-tab').forEach(x=>x.classList.toggle('on', x.dataset.side===tab));
  const t = $('.trending'), f = $('.feed');
  if(t) t.classList.toggle('on', tab==='trend');
  if(f) f.classList.toggle('on', tab==='feed');
}

function renderTrendingFull(){
  const list = $('#mTrendList');
  const items = (TRENDING && TRENDING[state.trendTab]) || [];
  list.innerHTML = '';
  if(!items.length){
    list.innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:40px 0">暂无数据</div>';
    return;
  }
  items.slice(0, 20).forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'trend-item';
    row.innerHTML = buildTrendItem(p, i, true);
    list.appendChild(row);
  });
}

function openTrendModal(){
  $('#trendModal').classList.add('open');
  document.querySelectorAll('#mTrendTabs .trend-tab').forEach(x=>x.classList.toggle('on', x.dataset.tab===state.trendTab));
  renderTrendingFull();
}

function closeTrendModal(){ $('#trendModal').classList.remove('open'); }

// ---- 今日关注动态 ----
const FEED_COLORS = { repo:'#0969da', star:'#e3a008', follow:'#8250df', pr:'#1a7f37', release:'#bf3989', public:'#656d76', push:'#d73a49' };
function renderFeed(){
  const list = $('#feedList');
  const items = FEED || [];
  $('#feedUpdated').textContent = '更新于 ' + UPDATED;
  list.innerHTML = '';
  if(!items.length){
    list.innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px 0">今日暂无关注动态</div>';
    return;
  }
  items.forEach(f => {
    const color = FEED_COLORS[f.kind] || '#8b949e';
    let verb = '', target = '';
    if(f.kind === 'repo'){ verb = '新建了仓库'; target = f.repo; }
    else if(f.kind === 'star'){ verb = 'star 了'; target = f.repo; }
    else if(f.kind === 'follow'){ verb = '关注了'; target = f.target; }
    else if(f.kind === 'pr'){ verb = '提交了 PR'; target = f.title || f.repo; }
    else if(f.kind === 'release'){ verb = '发布了 release'; target = f.tag || f.repo; }
    else if(f.kind === 'public'){ verb = '公开了仓库'; target = f.repo; }
    else if(f.kind === 'push'){ verb = '推送了提交'; target = f.repo + ' (' + f.size + ' 个)'; }
    const row = document.createElement('div');
    row.className = 'feed-item';
    row.innerHTML =
      '<span class="fd" style="background:'+color+'"></span>' +
      '<span class="fa">'+escHtml(f.actor)+'</span>' +
      '<span class="fv">'+verb+'</span>' +
      '<a class="ft" href="'+escHtml(f.url||'')+'" target="_blank" rel="noopener">'+escHtml(target)+'</a>' +
      '<span class="tm">'+escHtml((f.day ? f.day+' ' : '') + f.time)+'</span>';
    list.appendChild(row);
  });
}

// ---- 事件绑定 ----
function bindEvents(){
  $('#q').addEventListener('input', e => {
    state.q = e.target.value;
    $('#btnClear').style.display = state.q ? 'block':'none';
    // 搜索即全局搜索：输入关键词时自动清空其它筛选，避免结果被挡住
    if(state.q && (state.cat || state.lang || state.star !== 'all')){
      state.cat = ''; state.lang = ''; state.star = 'all';
      renderCats(); renderLangSel();
      document.querySelectorAll('#starSel button').forEach(x=>x.classList.toggle('on', x.dataset.v==='all'));
    }
    renderList();
  });
  $('#btnClear').onclick = () => { $('#q').value=''; state.q=''; $('#btnClear').style.display='none'; renderList(); $('#q').focus(); };
  $('#btnResetAll').onclick = () => {
    state.q=''; state.cat=''; state.lang=''; state.star='all';
    $('#q').value=''; $('#btnClear').style.display='none';
    renderCats(); renderLangSel();
    document.querySelectorAll('#starSel button').forEach(x=>x.classList.toggle('on', x.dataset.v==='all'));
    renderList();
  };
  $('#langSel').addEventListener('change', e => { state.lang = e.target.value; renderList(); });
  $('#sortSel').addEventListener('change', e => { state.sort = e.target.value; renderList(); });
  $('#starSel').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    state.star = b.dataset.v;
    document.querySelectorAll('#starSel button').forEach(x=>x.classList.toggle('on', x===b));
    renderList();
  });
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if(!el) return;
    const act = el.dataset.act;
    const card = el.closest('.card, .row');
    const nameEl = card ? card.querySelector('.name') : null;
    const ownerEl = card ? card.querySelector('.owner') : null;
    const fn = (nameEl && ownerEl) ? (ownerEl.textContent + '/' + nameEl.textContent) : '';
    if(act === 'fav') toggleFav(fn);
    if(act === 'cattag'){ state.cat = el.dataset.cat; renderCats(); renderList(); }
    if(act === 'expand'){ const d = card ? card.querySelector('.desc') : null; if(!d) return; const expanded = d.classList.toggle('expand'); el.textContent = expanded ? '收起' : '展开'; }
  });

  $('#btnExport').onclick = exportJson;
  $('#btnImport').onclick = () => $('#fileInput').click();
  // GitHub Pages 部署：无 Vercel 中转，改为打开 Actions 页手动触发刷新
  const REFRESH_URL = 'https://github.com/ghoustghoust/starhub/actions/workflows/update.yml';
  let refreshCooldown = 0;
  $('#btnRefresh').onclick = () => {
    const now = Date.now();
    if (now - refreshCooldown < 60000) { toast('刷新页已打开，请稍候再试'); return; }
    refreshCooldown = now;
    window.open(REFRESH_URL, '_blank', 'noopener');
    toast('已打开 GitHub Actions，点击 “Run workflow” 立即刷新');
  };
  $('#fileInput').addEventListener('change', importJson);

  $('#btnTheme').onclick = () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
    applyTheme(t); renderCats(); renderList();
  };
  $('#btnView').onclick = () => {
    const v = getView() === 'list' ? 'card' : 'list';
    try{ localStorage.setItem(VIEW_KEY, v); }catch(e){}
    applyView(v); renderList();
  };
  $('#langToggle').addEventListener('click', () => {
    const t = $('#langToggle'), body = $('#langBody');
    const open = t.getAttribute('aria-expanded') === 'true';
    t.setAttribute('aria-expanded', String(!open));
    body.hidden = open;
  });
  $('#trendTabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if(!b) return;
    switchTrendTab(b.dataset.tab);
  });
  document.querySelectorAll('.side-tab').forEach(b => b.addEventListener('click', () => switchSideTab(b.dataset.side)));
  $('#mTrendTabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if(!b) return;
    switchTrendTab(b.dataset.tab, '#mTrendTabs');
    renderTrendingFull();
  });
  $('#trendMore').addEventListener('click', openTrendModal);
  document.addEventListener('click', e => {
    if(e.target.closest('[data-close]')){ closeTrendModal(); return; }
    if(e.target.classList.contains('modal')){ closeTrendModal(); }
  });
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
    if(e.key === '/' && !typing){
      e.preventDefault(); $('#q').focus();
    }
    if(e.key === 'Escape'){
      if($('#trendModal').classList.contains('open')){ closeTrendModal(); return; }
      if(document.activeElement === $('#q')){
        $('#q').value=''; state.q=''; $('#btnClear').style.display='none'; renderList(); $('#q').blur();
      }
    }
  });
}

function toggleFav(fn){
  if(!fn) return;
  if(favs.has(fn)){ favs.delete(fn); toast('已取消收藏'); }
  else { favs.add(fn); toast('已收藏并置顶'); }
  saveFavs();
  renderList();
}

function saveFavs(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify([...favs])); }catch(e){}
}

function exportJson(){
  const payload = {
    type: 'github-starhub-backup',
    user: 'ghoustghoust',
    exportedAt: new Date().toISOString(),
    favorites: [...favs],
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'starhub-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出备份（收藏 '+favs.size+' 项）');
}

function importJson(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const obj = JSON.parse(r.result);
      const arr = obj.favorites || obj.favs || [];
      if(!Array.isArray(arr)) throw 0;
      favs = new Set(arr.filter(x => DATA.some(d=>d.full_name===x)));
      saveFavs(); renderList();
      toast('已恢复收藏 '+favs.size+' 项');
    }catch(err){ toast('导入失败：文件格式不正确'); }
  };
  r.readAsText(f);
  e.target.value = '';
}

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}

// ---- init ----
// 统计数字滚动动效：仅在首次进入视口时触发一次
let counted = false;
function countUp(el, target, dur){
  dur = dur || 700;
  const t0 = performance.now();
  const step = now => {
    const p = Math.min((now - t0) / dur, 1);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
    if(p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
if('IntersectionObserver' in window){
  const io = new IntersectionObserver(entries => {
    if(entries[0].isIntersecting && !counted){
      counted = true;
      countUp($('#stTotal'), DATA.length);
      io.disconnect();
    }
  }, {threshold:.4});
  io.observe($('#stTotal').parentElement.parentElement);
}else{ counted = true; }
renderHeader();
applyTheme(getTheme());
applyView(getView());
renderLangBar();
renderCats();
renderLangSel();
renderList();
renderTrending();
renderFeed();
switchSideTab(state.sideTab);
bindEvents();
</script>
</body>
