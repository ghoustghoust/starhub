name: Star Fast Refresh

# 15 分钟新星快车道（SPEC 2026-10-02 §4-T3/T4）。
#
# ── 架构原则（用户裁决 2026-10-03 功能解耦；2026-10-07 P0 把裁决执行到底）──────
# 本车道只做 star 这一件事：拉 star → 分类/点评/翻译 → 把状态提交回库。
# **不产出、不发布任何 HTML。** 站点内容的唯一通路是 update.yml。
#
# 为什么必须这样：Pages 部署是**整棵制品替换**，不是增量合并。一条要发布 1 个字的车道，
# 被迫把整站所有文件重放一遍；它那份清单只能列"作者当时想到的名字"，而站点里有开集产物
# （rss-data-1..N.js，N 随数据量浮动）⇒ 永远列不全。2026-10-07 实测：本车道那份带回清单是
# 7 个硬编码名字 + index.html = **8 文件制品**，不含 rss-data-1+；同一天小时场的制品是
# **15 文件**（含 chunk1–6，各 5.9–7.7MB）。本车道每真发布一次就把阅读器后台数据从线上
# 抹掉一次：chunk1 于 05:28:25 随小时场复活，**18 分 42 秒后**被 05:45 那场本车道抹回 404。
# 同类缺陷此前已按"往闭集表加一个名字"补过两次（lib/+api/ 10-02、trending_board 10-05），
# 都复发了——加名字是闭集表达开集，只有取消本车道的发布权才是结构性收口。
#
# 代价（明写，不粉饰）：新星上线从 ≤15 分钟回落到 ≤1 小时（等下一场小时场）。
# 实测本车道 96% 场次是空转（fast 提交 3.9 次/天 vs 上限 96 次/天），买回的只有每天约
# 4 个事件提前 ≤45 分钟，付出的是阅读器每天约 2 小时只剩首屏 51 个信源。
#
# 触发：cron-job.org 每 15 分钟 POST /api/refresh?mode=star（主力，§7.1 schedule 漂移不可信）；
# GitHub schedule 兜底。mode=star 由 api/refresh.js 分流到本 workflow。

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # star 功能私有状态（known_categories/known_notes）有新星时提交
                    # 2026-10-07 P0：pages/id-token 两条已摘——本车道不再发布，留着就是
                    # 一条没人用但随时可以捅穿站点的能力面（判据钉 permissions 键集合 == {contents}）

concurrency:
  group: starhub-fast   # 独立于 starhub-update：快车道绝不取消小时场
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # 超 12 分钟就撞上下一场（15 分钟节奏），cancel-in-progress 会把本场提交掐掉
    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1   # 只读工作树文件；三缓存提交是窄 pathspec，不需要全历史

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Quality gate — syntax (blocking)
        run: python -m py_compile fast_refresh.py fetch_and_build.py

      - name: Fast refresh
        id: fast
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # pipefail 不是修饰词：`python … | tee` 的退出码本来是 tee 的，快车道崩了也是绿，
        # 于是末步 `steps.fast.outcome == 'failure'` 永不成立（那铃从来没响过），崩场还会
        # 带着不含 "no change" 的 fast.log 一路走进提交步 ⇒ 推一枚没有新内容的提交并写 changed=true。
        # fast_refresh.main() 只 return 0（无良性非零路径），所以这里加了只会把真崩溃如实标红。
        run: set -o pipefail; python fast_refresh.py | tee fast.log

      - name: Commit star state to its own branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if grep -q "no change, skip write" fast.log; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 2026-10-08 P1：状态改推 orphan 分支 star-state，**不再推 main**。
          # 原来本车道每 15 分钟往 main 提交一次，而小时场单场要跑 ~35 分钟 ⇒ 它的 push 必然
          # non-fast-forward；重试只有一次、重试本身又要 5 分钟构建，第二次再被拒就整场红、
          # Pages 整场不发（10-07 04:00 实锤，远端三次 fast 提交夹掉它的两次 push）。
          # 现在 main 的自动写者只剩 update.yml 一个，撞车从"概率事件"变成"不可能事件"。
          # 读端在 update.yml 的 Restore star state 步（并集回工作树，绝不缩小 + 地板值闸门）。
          #
          # 用 plumbing 造提交，不走 add/commit：actions/checkout 的工作树里躺着整份源码，
          # 而 star-state 只该装这两个状态文件——把源码一起放进去，读端 fetch 到的就是
          # "停在旧流程的过期副本"（正是 10-07 事故里库里那份 rss-data-1.js 的坑）。
          # 本分支唯一写者就是这条车道 ⇒ 不需要 merge、不需要重试链：
          # --force-with-lease 的租约基线取本场刚 fetch 下来的 tip，真冒出第二个写者才会被拒。
          # descriptions_zh.json 不在清单里：它已进 starhub-state 缓存家族（.gitignore + 出树），
          # add 它必被拒，新星场的分类结果会提交不出去（10-04 03:0x 实锤，15 分钟循环炸）。
          # 读基线不许写成 `parent=$(git ls-remote … | cut -f1)`：管道尾是 cut，ls-remote 非零
          # 会被掩成 rc=0 + 空串 ⇒ 整块被跳过 ⇒ 走 init 路径 ⇒ `--force-with-lease=star-state:`
          # （期待分支不存在）必被拒 ⇒ 只剩一条把原因说成"第二个写者"的假因 warning，
          # 全场绿着把本场分类丢掉（2026-10-08 对抗审查实测）。git 的三种码要分开：
          # 0=分支在；2=--exit-code 无匹配=分支还没有；其它=真的读不到（网络/权限）。
          rc=0
          ls_line=$(git ls-remote --exit-code origin refs/heads/star-state) || rc=$?
          if [ "$rc" -eq 2 ]; then
            parent=""
          elif [ "$rc" -ne 0 ]; then
            echo "::warning::[fast] 读不到 star-state 基线（ls-remote rc=$rc），本场放弃提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          else
            parent=$(printf '%s\n' "$ls_line" | cut -f1)
          fi
          if [ -n "$parent" ]; then
            # ⚠ 浅检出里**没有** star-state 的对象，而 commit-tree -p 要的是能在本地解析的对象：
            # ls-remote 只回一个 sha ⇒ "fatal: <sha> is not a valid object" ⇒ bash -e 整步 exit 128。
            # 10-08 实锤：分支由 09:30 那场（init 路径、无父）建出来，之后**每一场有新星都必红**
            # （09:45、10:00、10:11、10:15 连续四场）。判据当时全绿，因为它用的是全量 clone——父提交本来就在场。
            # 先把 tip fetch 下来；depth=1 够用：commit-tree 只要父对象本身在场，不需要它的祖先。
            # fetch 失败也是"读不到基线"，与上面同源 ⇒ 同一种处置（放弃 + 出声），别让一次抖动把
            # 每 15 分钟一场变成连片红，也别让它绿着走 init 路径去覆盖分支。
            if ! git fetch -q --depth=1 origin refs/heads/star-state; then
              echo "::warning::[fast] fetch star-state 失败，本场放弃提交（不 fetch 就没法追加）"
              echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # 用 FETCH_HEAD 而不是上面那个 sha 当父与租约基线：两者之间若真有第二个写者挤进来，
            # 基线取"我刚追加上去的那枚"才是对的，取旧 sha 会把别人的提交直接判成租约冲突。
            parent=$(git rev-parse FETCH_HEAD)
            # 取到父提交**不能只拿它的 sha**：上一场写进分支的键，本场工作树里没有——工作树底本
            # 来自 main，而 main 上的 known_notes.json 最后一次被写是 06:46Z（P1 落地之前），因为
            # update.yml 的 add 清单（:342/:377）里有 known_categories.json 却没有 known_notes.json。
            # 直接用工作树造 tree 就等于每场把上一场的成果抹掉（10-08 实测：
            # libukai/awesome-deepseek-harness 的点评在 main 与分支新 tip 里双双不存在，只活过一场）。
            # 写端并集：同键以本场为准（本场分类更新），分支独有键捞回，同样过地板值闸门，绝不缩小。
            # PYTHONIOENCODING 不是装饰：这台工具的输出全是中文诊断，控制台编码不认时 print 本身
            # 会抛 UnicodeEncodeError ⇒ rc=1 ⇒ 这里判成"并集没做完"⇒ 每场静默放弃提交
            # （本地夹具实测到过：GBK 控制台下崩在 '⇒' 上，判据却照样绿，因为放弃消息是 bash 打的）。
            if ! PYTHONIOENCODING=utf-8 python tools/restore_star_state.py --merge-onto "$parent"; then
              # 并集没做完（地板闸门拒绝、或脚本任何异常）⇒ 绝不"照样推"：那推上去的就是没并过的
              # 缩小 tree，正是这里要防的事。放弃本场提交并出声，下一场重新 diff 补上，数据不丢。
              # （读端不需要这层：读端"不写"很安全，main 那份本来就在；写端"不写"会一路走到提交。）
              echo "::warning::[fast] star-state 写端并集未完成，本场放弃提交（推上去会缩小分支）"
              echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          idx=$(mktemp)
          GIT_INDEX_FILE="$idx" git read-tree --empty
          for f in known_categories.json known_notes.json; do
            sha=$(git hash-object -w "$f")
            GIT_INDEX_FILE="$idx" git update-index --add --cacheinfo "100644,$sha,$f"
          done
          tree=$(GIT_INDEX_FILE="$idx" git write-tree)
          rm -f "$idx"
          if [ -n "$parent" ]; then
            commit=$(git commit-tree "$tree" -p "$parent" \
              -m "chore: star state $(TZ=Asia/Shanghai date +%F' '%H:%M)")
            lease="--force-with-lease=star-state:$parent"
          else
            commit=$(git commit-tree "$tree" \
              -m "chore: star state init $(TZ=Asia/Shanghai date +%F' '%H:%M)")
            lease="--force-with-lease=star-state:"
          fi
          if git push $lease origin "$commit:refs/heads/star-state"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            # 被拒的两种真实原因：租约基线过期（真冒出了第二个写者）、或 push 自身失败（网络/权限）。
            # 原来这里写成"唯一可能的原因是第二个写者"，是错的——它会把一次网络抖动读成有人在抢分支，
            # 排障方向整个带偏。绝不 --force 覆盖别人；下一场重新 diff 会补上，数据不丢。
            echo "::warning::[fast] star-state 推送被拒（租约过期或 push 失败），本场放弃"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # 2026-10-07 P0：这里原有 Stage（从线上 curl 带回 7 个硬编码名字）+ Upload Pages artifact
      # + Deploy to GitHub Pages 三步，已整体删除。删除的理由写在文件头部的架构原则里
      # （整棵制品替换 + 闭集追不上开集 = 每发布一次抹掉阅读器后台数据一次）。
      # 判据 tests/site_nav_drift/test_star_fast_wiring.py::test_fast_lane_has_no_publish_authority
      # 钉住"本车道再无发布权"：permissions 键集合 == {contents} 且 uses: 集合 ⊆ {checkout, setup-python}。
      - name: Mark the run red when fast did not run
        if: always() && steps.fast.outcome == 'failure'
        run: |
          echo "::error::[fast] fast_refresh 失败，本场 star 状态未提交（新星分类结果没入库，下一场会重新烧一次 LLM）"
          exit 1
