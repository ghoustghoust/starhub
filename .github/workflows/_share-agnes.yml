# 一次性工具（用后删除）：把本仓库的 AGNES_API_KEY 同步到 qwis-portal 仓库 Secrets + qwis-intel Vercel env
# 背景：qwis 项目的 Agnes key 是失效/受限旧 key，starhub 的 key 云端可用（无 IP 封锁）
# Secrets 需求：AGNES_API_KEY（已有）、QWIS_PAT（临时）、VERCEL_TOKEN（临时）
name: share-agnes-key
on:
  workflow_dispatch:

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install libsodium
        run: npm install libsodium-wrappers --no-save --no-audit --no-fund

      - name: Copy AGNES_API_KEY to qwis-portal Secrets + qwis-intel Vercel env
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          QWIS_PAT: ${{ secrets.QWIS_PAT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node -e '
          const sodium = require("libsodium-wrappers");
          const KEY = process.env.AGNES_API_KEY;
          const PAT = process.env.QWIS_PAT;
          const VTOKEN = process.env.VERCEL_TOKEN;
          if (!KEY) { console.error("AGNES_API_KEY empty"); process.exit(1); }
          console.log("key len:", KEY.length, "tail:", "****" + KEY.slice(-4));
          (async () => {
            await sodium.ready;
            // 1) 写入 qwis-portal GH Secrets
            const gh = { Authorization: "Bearer " + PAT, Accept: "application/vnd.github+json" };
            const pk = await (await fetch("https://api.github.com/repos/ghoustghoust/qwis-portal/actions/secrets/public-key", { headers: gh })).json();
            const enc = sodium.crypto_box_seal(Buffer.from(KEY, "utf8"), Buffer.from(pk.key, "base64"));
            const r1 = await fetch("https://api.github.com/repos/ghoustghoust/qwis-portal/actions/secrets/AGNES_API_KEY", {
              method: "PUT",
              headers: { ...gh, "Content-Type": "application/json" },
              body: JSON.stringify({ encrypted_value: Buffer.from(enc).toString("base64"), key_id: pk.key_id }),
            });
            console.log("GH secret write:", r1.status);
            // 2) 写入 Vercel qwis-intel env
            const vh = { Authorization: "Bearer " + VTOKEN, "Content-Type": "application/json" };
            const team = "team_lhuQMlsXgwYC93FSnBSfYxnx";
            const list = await (await fetch("https://api.vercel.com/v9/projects/qwis-intel/env?teamId=" + team, { headers: vh })).json();
            const existing = (list.envs || []).find((e) => e.key === "AGNES_API_KEY");
            if (existing) {
              const r2 = await fetch(`https://api.vercel.com/v9/projects/qwis-intel/env/${existing.id}?teamId=${team}`, {
                method: "PATCH", headers: vh,
                body: JSON.stringify({ value: KEY, type: "sensitive", target: ["production", "preview", "development"] }),
              });
              console.log("Vercel env PATCH:", r2.status);
            } else {
              const r2 = await fetch("https://api.vercel.com/v10/projects/qwis-intel/env?teamId=" + team + "&upsert=true", {
                method: "POST", headers: vh,
                body: JSON.stringify({ key: "AGNES_API_KEY", value: KEY, type: "sensitive", target: ["production", "preview", "development"] }),
              });
              console.log("Vercel env POST:", r2.status);
            }
          })().catch((e) => { console.error(e.message); process.exit(1); });
          '
