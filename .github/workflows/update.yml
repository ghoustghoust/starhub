name: Update Star Hub

on:
  push:
    branches: [main]
  schedule:
    # 每天 UTC 23:35 = 北京时间 07:35（上游每小时档位是配合 Vercel 实时刷新；本 fork 为 Pages 部署，无 Vercel，保持每日一次）
    - cron: "35 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: starhub-update
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Point build at ghoustghoust
        run: sed -i 's/^USER = .*/USER = "ghoustghoust"/' fetch_and_build.py

      - name: Fetch stars & build
        env:
          # 注入 Actions 自动 token（1000 次/时），避免匿名抓取被限流 403 导致每日构建静默失败
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_and_build.py

      - name: Rebrand page to ghoustghoust
        run: |
          sed -i 's/GitHub Star 收藏台 · Kwei168/GitHub Star 收藏台 · ghoustghoust/g' index.html
          sed -i "s/user: 'Kwei168'/user: 'ghoustghoust'/g" index.html

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ai-daily.html rss-aggregator.html known_categories.json descriptions_zh.json trending_snapshot.json translations.json rss_cache.json rss_history.json rss_sources.json rss_api_snapshot.json
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
          else
            git commit -m "chore: auto update stars $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase
            git push
          fi
